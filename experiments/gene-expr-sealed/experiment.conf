# Experiment configuration for compression certificate pipeline

EXPERIMENT_NAME="Gene Expression Classification"
TASK_DESC="Binary classification on 20,000 gene expression features (p >> n regime) with 8% label noise"

RUN_CMD="uv run python train.py"
PACKAGES="scikit-learn, xgboost, numpy, scipy, pandas"
MODEL_INTERFACE=".predict(X)"
EXTRA_FILES=""
REPRODUCE_EXTRA_FILES=""
SETUP_CMD=""

REPRODUCE_IMPORTS="from prepare_reproduce import load_train, save_model, get_feature_names"

REPRODUCE_FUNCTIONS="- load_train() → (X_train, y_train) — 2,000 x 20,000 gene expression features. Call as many times as you want.
- save_model(model) — save your trained model. Model must have .predict(X). Call once at end.
- get_feature_names() → list of feature names"

BANNED_VAL_FUNCTIONS="load_val"

COMPRESS_STRATEGY_DESC="What model, hyperparameters, feature selection (specific genes or indices), regularization, and techniques actually mattered?"
COMPRESS_AVAILABLE_FUNCTIONS="load_train(), evaluate_val(model), get_feature_names()"
COMPRESS_PRIORITIES="exact model class, exact hyperparameters (including random_state), exact feature selection method and parameters, regularization strength"

COMPRESS_TOKENS=128

# --- Experimental conditions ---
VAL_ACCESS_LEVEL="score_only"
EXPLORER_FRAMING="standard"

# --- Explore prompt variables ---
EXPLORE_SETUP_STEP="**Stage data**: Before launching the agent, run \`uv run python stage_data.py\` from experiments/gene-expr-sealed to materialize the sealed cache. Then run \`uv run python prepare.py\` to verify the loader."
EXPLORE_GIT_ADD="train.py prepare.py pyproject.toml explore_prompt.md"
EXPLORE_TASK_DESC="Binary classification on gene expression data (p >> n):
- 2,000 training samples, 20,000 features (gene expression levels)
- 20,000 validation samples (your optimization target)
- Most features are uninformative; a small unknown subset carries the signal
- Labels are noisy; perfect accuracy is not attainable
- You must LEARN the predictive features from the training data"
EXPLORE_VAL_SIZE=20000
