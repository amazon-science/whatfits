# Experiment configuration for compression certificate pipeline

EXPERIMENT_NAME="NYC 311 Service Request 72h Closure (Jan 2026)"
TASK_DESC="Binary classification on real NYC 311 service requests from January 2026: predict whether a request is closed within 72 hours of creation, using only creation-time metadata"

RUN_CMD="uv run python train.py"
PACKAGES="scikit-learn, xgboost, numpy, scipy, pandas"
MODEL_INTERFACE=".predict(X)"
EXTRA_FILES=""
REPRODUCE_EXTRA_FILES=""
SETUP_CMD=""

REPRODUCE_IMPORTS="from prepare_reproduce import load_train, save_model, get_feature_names"

REPRODUCE_FUNCTIONS="- load_train() → (X_train, y_train) — 10,000 x N creation-time request features. Call as many times as you want.
- save_model(model) — save your trained model. Model must have .predict(X). Call once at end.
- get_feature_names() → list of feature names"

BANNED_VAL_FUNCTIONS="load_val"

COMPRESS_STRATEGY_DESC="What model, hyperparameters, feature encoding (which of the categorical/numeric columns, how encoded), feature selection, regularization, and preprocessing actually mattered?"
COMPRESS_AVAILABLE_FUNCTIONS="load_train(), evaluate_val(model), get_feature_names()"
COMPRESS_PRIORITIES="exact model class, exact hyperparameters (including random_state), exact feature encoding and any feature selection, preprocessing/scaling, regularization strength"

COMPRESS_TOKENS=128

# --- Experimental conditions ---
VAL_ACCESS_LEVEL="score_only"
EXPLORER_FRAMING="standard"

# --- Explore prompt variables ---
EXPLORE_SETUP_STEP="**Prepare data**: Run \`uv run python prepare.py\` to build the NYC 311 dataset from the staged raw CSV (cached after first run)."
EXPLORE_GIT_ADD="train.py prepare.py pyproject.toml explore_prompt.md"
EXPLORE_TASK_DESC="Binary classification on real NYC 311 service requests (January 2026):
- 10,000 training samples; 17 features per request
- 20,000 validation samples (your optimization target)
- Predict closed_within_72h: whether the request was closed within 72 hours of creation
- Features are creation-time metadata only: agency, complaint type/descriptor, location type, zip/city/borough, community board / council district / police precinct, submission channel, latitude/longitude, and derived created-time fields (hour, day-of-week, day, week)
- Categorical fields arrive integer-coded; you may re-encode them (e.g. one-hot, target-free encodings) as you see fit
- Base rate is roughly 67% positive; a strong model reaches the low-to-mid 80s in accuracy on val"
EXPLORE_VAL_SIZE=20000
EXPLORE_TRAIN_FUNCTIONS="- \`load_train()\` → \`(X_train, y_train)\` — 10,000 x 17 features"
EXPLORE_VAL_FUNCTION="load_val()"
EXPLORE_VAL_FUNCTION_DESC=""
EXPLORE_EVAL_ARGS="model"
EXPLORE_EXTRA_FUNCTIONS="- \`get_feature_names()\` — list of feature names (agency, complaint_type, descriptor, ...)"
EXPLORE_CAN_MODIFY="model, hyperparameters, feature encoding, feature selection, feature engineering, preprocessing, everything"
EXPLORE_CAN_USE="Use any model from scikit-learn, xgboost, or built from numpy/scipy"
EXPLORE_TRY_WHAT="feature encoding, feature engineering, regularization, model choice, hyperparameter tuning"
EXPLORE_TIME_CONSTRAINT="Exceed the 30-second training time budget."
EXPLORE_STRATEGIES="1. **Feature encoding**: the categorical columns are integer-coded by default — try one-hot / frequency encoding, or tree models that handle high-cardinality codes well
2. **Model search**: LogisticRegression, LinearSVC, RandomForest, HistGradientBoostingClassifier, XGBoost
3. **Regularization**: L1/L2, tree depth / leaf constraints, learning rate
4. **Feature engineering**: interactions, created-time cyclicity (hour/day-of-week), geographic bucketing
5. **Feature selection**: drop weak/high-cardinality columns, mutual information, model-based importance
6. **Hyperparameter tuning**: C, n_estimators, max_depth, learning_rate, random_state
7. **Handling class imbalance**: class_weight, threshold tuning"
EXPLORE_READ_RESULTS="Look for the val_accuracy printed by evaluate_val."
EXPLORE_LOG_CATEGORIES="Model, feature encoding, feature engineering, hyperparameters"
EXPLORE_RUN_NOTE="Train within the 30-second budget."
